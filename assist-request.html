<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root{
      --page-bg-top:#203f5c;
      --page-bg-bot:#102d49;
      --panel:#ffffff;
      --text:#122238;
      --muted:#64748b;
      --line:#dbe6f2;
      --accent:#6d8eae;
      --accent-2:#67A4E7;
      --danger:#e85b4b;
    }

    *{box-sizing:border-box;}
    html,body{min-height:100%; margin:0; overflow-x:hidden;}
    body{
      font-family:'Plus Jakarta Sans',Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:#102d49;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-2;
      background:url('assets/t.jpg') center/cover no-repeat;
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      background:
        radial-gradient(900px 480px at 18% 8%, rgba(255,255,255,.09), transparent 60%),
        radial-gradient(760px 420px at 82% 2%, rgba(103,164,231,.18), transparent 62%),
        linear-gradient(180deg, rgba(34,64,90,.82), rgba(18,50,79,.88));
    }

    .assist-page{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:34px 22px;
    }

    .assist-shell{
      width:min(100%, 980px);
    }

    .assist-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
      color:#fff;
    }

    .assist-brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .assist-brand img{
      height:36px;
      width:auto;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.28));
    }

    .assist-brand-title{
      font-size:13px;
      letter-spacing:.16em;
      text-transform:uppercase;
      font-weight:600;
      opacity:.9;
    }

    .assist-back{
      color:#fff;
      text-decoration:none;
      border:1px solid rgba(255,255,255,.20);
      background:rgba(255,255,255,.08);
      border-radius:999px;
      padding:9px 15px;
      font-size:13px;
      font-weight:600;
      backdrop-filter:blur(10px);
      transition:.2s ease;
    }

    .assist-back:hover{
      background:rgba(255,255,255,.15);
      transform:translateY(-1px);
    }

    .assist-card{
      display:grid;
      grid-template-columns:.9fr 1.25fr;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.20);
      border-radius:28px;
      background:rgba(255,255,255,.92);
      box-shadow:0 34px 80px rgba(0,0,0,.34);
      backdrop-filter:blur(18px);
    }

    .assist-intro{
      padding:34px;
      color:#fff;
      background:
        radial-gradient(520px 280px at 10% 0%, rgba(255,255,255,.16), transparent 60%),
        linear-gradient(160deg, #153555, #0b2137 72%);
    }

    .assist-eyebrow{
      color:#9fc3e6;
      font-size:11px;
      letter-spacing:.22em;
      text-transform:uppercase;
      font-weight:700;
      margin-bottom:16px;
    }

    .assist-intro h1{
      margin:0;
      color:#fff;
      font-size:clamp(28px,4vw,43px);
      line-height:1.02;
      letter-spacing:-.045em;
      font-weight:700;
    }

    .assist-intro p{
      margin:18px 0 0;
      color:#d4e3f4;
      line-height:1.7;
      font-size:14px;
      max-width:330px;
    }

    .assist-points{
      margin:26px 0 0;
      padding:0;
      list-style:none;
      display:grid;
      gap:12px;
      color:#dbeafe;
      font-size:13px;
      font-weight:500;
    }

    .assist-points li{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .assist-points li::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:999px;
      background:#7fb7ee;
      box-shadow:0 0 0 5px rgba(127,183,238,.12);
      flex:0 0 auto;
    }

    .form-panel{
      min-width:0;
      padding:30px 34px 24px;
      overflow:hidden;
      background:linear-gradient(180deg, #ffffff, #f7faff);
    }

    #zf_div_pwBmcm-zBrzNaQpERUbgfmo3D_5oBq3g4XxvqkO0O7s{
      width:100%;
      max-width:100%;
      overflow:hidden;
    }

    #zf_div_pwBmcm-zBrzNaQpERUbgfmo3D_5oBq3g4XxvqkO0O7s iframe{
      display:block;
      max-width:100%;
    }

    @media (max-width:820px){
      .assist-page{padding:20px 14px; place-items:start center;}
      .assist-topbar{margin-bottom:12px;}
      .assist-card{grid-template-columns:1fr; border-radius:22px;}
      .assist-intro{padding:26px 22px;}
      .form-panel{padding:24px 20px 22px;}
      .assist-brand-title{display:none;}
    }
  </style>
</head>
<body>
  <main class="assist-page">
    <div class="assist-shell">
      <div class="assist-topbar">
        <div class="assist-brand">
          <img src="assets/ff.png" alt="Coldwell Banker UAE logo">
          <div class="assist-brand-title">CB Helpdesk</div>
        </div>
        <a class="assist-back" href="https://mycbhelp.com/">Back to Helpdesk</a>
      </div>
      <section class="assist-card">
        <aside class="assist-intro">
          <div class="assist-eyebrow">Support form</div>
          <h1>How May I Help?</h1>
          <p>Complete the form below and our team will guide you.</p>
        </aside>
        <div class="form-panel">
          <div id="zf_div_pwBmcm-zBrzNaQpERUbgfmo3D_5oBq3g4XxvqkO0O7s">
          </div>
          <script type="text/javascript">
          (function() {
	try{
		var f = document.createElement("iframe");

			var ifrmSrc = 'https://forms.zohopublic.com/mycbhelp1/form/HowMayIhelpForm1/formperma/pwBmcm-zBrzNaQpERUbgfmo3D_5oBq3g4XxvqkO0O7s?zf_rszfm=1';


        try{
			if ( typeof ZFAdvLead != "undefined" && typeof zfutm_zfAdvLead != "undefined" ) {
				for( var prmIdx = 0 ; prmIdx < ZFAdvLead.utmPNameArr.length ; prmIdx ++ ) {
				    var utmPm = ZFAdvLead.utmPNameArr[ prmIdx ];
				    utmPm = ( ZFAdvLead.isSameDomian && ( ZFAdvLead.utmcustPNameArr.indexOf(utmPm) == -1 ) ) ? "zf_" + utmPm : utmPm;
				    var utmVal = zfutm_zfAdvLead.zfautm_gC_enc( ZFAdvLead.utmPNameArr[ prmIdx ] );
				    if ( typeof utmVal !== "undefined" ) {
				      if ( utmVal != "" ) {
				        if(ifrmSrc.indexOf('?') > 0){
				             ifrmSrc = ifrmSrc+'&'+utmPm+'='+utmVal;
				        }else{
				            ifrmSrc = ifrmSrc+'?'+utmPm+'='+utmVal;
				        }
				      }
				    }
				}
			}
			if ( typeof ZFLead !== "undefined" && typeof zfutm_zfLead !== "undefined" ) {
				for( var prmIdx = 0 ; prmIdx < ZFLead.utmPNameArr.length ; prmIdx ++ ) {
		        var utmPm = ZFLead.utmPNameArr[ prmIdx ];
		        var utmVal = zfutm_zfLead.zfutm_gC_enc( ZFLead.utmPNameArr[ prmIdx ] );
			        if ( typeof utmVal !== "undefined" ) {
			          if ( utmVal != "" ){
			            if(ifrmSrc.indexOf('?') > 0){
			              ifrmSrc = ifrmSrc+'&'+utmPm+'='+utmVal;//No I18N
			            }else{
			              ifrmSrc = ifrmSrc+'?'+utmPm+'='+utmVal;//No I18N
			            }
			          }
			        }
		      }
			}
			if (!((new RegExp("[?&]referrername=")).test(ifrmSrc))) {
            var rfr = window.location.href;

            try {
                rfr = window.self !== window.top ?
                    window.top.location.href :
                    (/^https?:\/\/[\w.-]+\.[a-zA-Z]{2,}/i.test(rfr) ? rfr : "");
            } catch (e) {}

            if (rfr && rfr !== "") {
                if (rfr.length > 1800) {
                    var queryIndex = rfr.indexOf('?');
                    if (queryIndex > -1) {
                        rfr = rfr.substring(0, queryIndex);
                    }
                    if (rfr.length > 1800) {
                        rfr = rfr.substring(0, 1800);
                    }
                }
                ifrmSrc += ((ifrmSrc.indexOf('?') > 0) ? '&' : '?') + 'referrername=' + encodeURIComponent(rfr);
            }
        }
		}catch(e){}


		f.src = ifrmSrc;
		f.style.border="none";
		f.style.height="755px";
		f.style.width="100%";
		f.style.transition="all 0.5s ease";
		f.setAttribute("aria-label", 'How May I help Form');

		var d = document.getElementById("zf_div_pwBmcm-zBrzNaQpERUbgfmo3D_5oBq3g4XxvqkO0O7s");
		d.appendChild(f);
		window.addEventListener('message', function (){
			var evntData = event.data;
			if( evntData && evntData.constructor == String ){
				var zf_ifrm_data = evntData.split("|");
				if ( zf_ifrm_data.length == 2 || zf_ifrm_data.length == 3 ) {
					var zf_perma = zf_ifrm_data[0];
					var zf_ifrm_ht_nw = ( parseInt(zf_ifrm_data[1], 10) + 15 ) + "px";
					var iframe = document.getElementById("zf_div_pwBmcm-zBrzNaQpERUbgfmo3D_5oBq3g4XxvqkO0O7s").getElementsByTagName("iframe")[0];
					if ( (iframe.src).indexOf('formperma') > 0 && (iframe.src).indexOf(zf_perma) > 0 ) {
						var prevIframeHeight = iframe.style.height;
						var zf_tout = false;
						if( zf_ifrm_data.length == 3 ) {
						    iframe.scrollIntoView();
						    zf_tout = true;
						}

						if ( prevIframeHeight != zf_ifrm_ht_nw ) {
							if( zf_tout ) {
							    setTimeout(function(){
							        iframe.style.height = zf_ifrm_ht_nw;
							    },500);
							} else {
							    iframe.style.height = zf_ifrm_ht_nw;
							}
						}
					}
				}
			}
		}, false);
    }catch(e){}


})();
          </script>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
